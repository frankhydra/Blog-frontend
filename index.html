<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Nchukwi</title>
    <meta name="description" content="Own your name, your work, and what it earns you - write, publish a newsletter, and launch a book, all under one roof." />
    <script>
      // Set the theme attribute before React mounts (and before first
      // paint), so a visitor who already chose one of the six themes -
      // or whose OS prefers dark mode, if they never chose - never sees
      // a flash of the wrong theme first. Kept as a tiny inline script
      // rather than something inside main.jsx because anything in the
      // React bundle necessarily runs after this initial HTML/CSS has
      // already painted once.
      //
      // The six valid keys and the OS-preference fallback must be kept
      // in sync by hand with ThemeContext.jsx's THEMES/getInitialTheme -
      // this script can't import from there since it has to run before
      // any JS module loads.
      (function () {
        var VALID = ['postmark', 'midnight', 'harbor', 'indigo', 'meadow', 'ash'];
        try {
          var stored = localStorage.getItem('theme');
          var theme = VALID.indexOf(stored) !== -1
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'postmark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage/matchMedia unavailable (e.g. privacy mode) -
          // fall back to the default postmark theme, nothing to do here.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
